project:
  name: ai_quant_research_platform
  version: 0.1.0
  description: Institutional-style AI-driven quant research and predictive trading platform.
  timezone: UTC
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  external_data: data/external
  live_data: data/live
  features: features
  models: models
  results: results
  notebooks: notebooks

data:
  default_start: "2018-01-01"
  default_end: null
  bar_interval: "1d"
  assets:
    stocks:
      - SPY
      - AAPL
      - MSFT
    forex:
      - EURUSD=X
      - GBPUSD=X
    commodities:
      - GC=F
    crypto:
      - BTC-USD
      - ETH-USD
  binance:
    symbols:
      - BTCUSDT
      - ETHUSDT
    interval: "1h"
    limit: 1000

preprocessing:
  missing_value_method: ffill
  outlier_clip_sigma: 3.0
  rolling_zscore_window: 60
  min_periods: 20

features:
  return_windows: [5, 10, 20, 60]
  autocorrelation_lags: [1, 2, 3, 4, 5]
  rsi_window: 14
  ema_fast: 8
  ema_slow: 33
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_window: 14
  volatility_windows: [10, 20]
  volume_window: 20
  fractal_left_window: 2
  fractal_right_window: 2
  liquidity_lookback: 20
  liquidity_volume_multiplier: 1.5
  trend_lookback: 20

microstructure:
  order_book_imbalance_bullish_threshold: 0.6
  order_book_imbalance_bearish_threshold: -0.6
  liquidity_lookback: 20
  liquidity_volume_multiplier: 1.5
  vwap_band_window: 20
  delta_divergence_lookback: 20

targets:
  horizons: [1, 5]
  classification:
    direction_labels: [-1, 1]
    tertile_labels: [-1, 0, 1]

research:
  train_years_initial: 2
  test_months: 3
  validation_size: 0.2
  embargo_bars: 5
  purge_bars: 5

models:
  xgboost:
    objective_regression: reg:squarederror
    objective_classification: binary:logistic
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    early_stopping_rounds: 50
  lstm:
    sequence_length: 60
    hidden_units: 128
    dropout: 0.2
    batch_size: 64
    epochs: 100
    learning_rate: 0.001
    early_stopping_patience: 10

evaluation:
  annualization_factor_daily: 252
  transaction_cost_bps: 2.0
  slippage_bps: 2.0
  signal_threshold: 0.001
  metrics:
    - sharpe_ratio
    - max_drawdown
    - cagr
    - calmar_ratio
    - information_coefficient
    - information_ratio
    - profit_factor
    - win_rate

risk:
  account_risk_per_trade: 0.01
  max_position_weight: 0.05
  max_leverage: 2.0
  max_daily_drawdown: -0.03
  high_volatility_scale: 0.5
  slippage_bps: 2.0
  market_impact_bps: 1.0
  correlation_threshold: 0.8
  min_confidence: 0.0

reinforcement_learning:
  environment:
    initial_cash: 100000.0
    transaction_cost_bps: 2.0
    rolling_vol_window: 20
    drawdown_penalty: 0.1
    reward_scaling: 1.0
    allow_short: true
  training:
    agent: PPO
    policy: MlpPolicy
    total_timesteps: 10000
    learning_rate: 0.0003
    gamma: 0.99
    seed: 42

regime_detection:
  hmm_states: 3
  kmeans_clusters: 3
  rolling_vol_window: 20
  trend_window: 20
  volume_window: 20
  adx_window: 14
  adx_trending_threshold: 25.0
  adx_ranging_threshold: 20.0
  min_regime_samples: 30

alternative_data:
  sentiment_momentum_window: 3
  finbert_model_name: ProsusAI/finbert
  google_trends_timeframe: "today 5-y"
  macro_series:
    cpi: CPIAUCSL
    pmi: NAPM
    fed_funds: FEDFUNDS
    vix: VIXCLS

optimization:
  n_trials: 100
  sampler: TPE
  pruner: MedianPruner
  objective: validation_ic
  n_splits: 5
  purge_bars: 5
  embargo_bars: 5
  xgboost_search_space:
    n_estimators: [100, 1000]
    max_depth: [2, 8]
    learning_rate: [0.005, 0.2]
    subsample: [0.5, 1.0]
    colsample_bytree: [0.5, 1.0]
    reg_alpha: [0.00000001, 10.0]
    reg_lambda: [0.00000001, 10.0]
  lstm_search_space:
    num_layers: [1, 3]
    hidden_size: [32, 256]
    dropout: [0.0, 0.5]
    learning_rate: [0.00001, 0.01]
    batch_size_choices: [32, 64, 128]

ensemble:
  rolling_ic_window: 20
  default_method: ic_weighted
  allow_short_weights: true
  stacking:
    model: Ridge
    alpha: 1.0
  prediction_columns:
    - xgboost
    - lstm
    - linear_baseline

walk_forward:
  initial_train_years: 2
  test_months: 3
  validation_fraction: 0.2
  rolling_ic_window: 20
  retrain_ic_threshold: 0.02
  drift_psi_threshold: 0.2
  expanding: true

factor_risk:
  benchmark_column: SPY
  factor_columns: [MKT, SMB, HML, UMD]
  volatility_column: VIX
  annualization_factor: 252
  risk_free_rate: 0.0

portfolio:
  signal_threshold: 0.001
  account_value: 100000.0
  risk_per_trade: 0.01
  atr_multiplier: 2.0
  max_position_weight: 0.05
  max_gross_leverage: 1.0
  slippage_bps: 2.0
  spread_bps: 1.0
  commission_bps: 0.0

live:
  enabled: false
  rolling_buffer_bars: 200
  reconnect_backoff_seconds: 5
  binance_symbols: [BTCUSDT, ETHUSDT]
  binance_intervals: ["1h", "15m", "5m"]
  max_reconnect_attempts: null
  signal_threshold: 0.001
  confidence_scale: 0.01
  blocked_regimes: [risk_off, crash, halt]
  lstm_sequence_length: 60
  signal_timeframes:
    trend: "1h"
    confirmation: "15m"
    entry: "5m"

monitoring:
  rolling_ic_window: 20
  ic_decay_threshold: 0.02
  psi_drift_threshold: 0.2
  retrain_consecutive_periods: 2
  prediction_column: prediction
  realized_return_column: realized_return
  strategy_return_column: strategy_return

alerting:
  telegram_enabled: false
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  discord_enabled: false
  discord_webhook_url_env: DISCORD_WEBHOOK_URL

dashboard:
  live_predictions_path: data/live/signals.jsonl
  portfolio_returns_path: results/portfolio/portfolio_returns.csv
  shap_importance_path: results/explainability/global_importance.csv

mlflow:
  tracking_uri: "file:./results/mlruns"
  experiment_name: "ai_quant_research_platform"
